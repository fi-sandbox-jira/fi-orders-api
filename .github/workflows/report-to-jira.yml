# Builds API auth: OAuth 2.0 2LO (client credentials), confirmed live
# 2026-09-24 - see github/CLAUDE.md, "OAuth для Builds API". Basic auth with
# email+API-token does NOT work here regardless of scope - don't revert this
# to secrets.JIRA_AUTOMATION_EMAIL/TOKEN.
#
# JIRA_OAUTH_CLIENT_ID/JIRA_OAUTH_CLIENT_SECRET come from Jira's own
# Settings -> Apps -> OAuth credentials (deep link: /secure/admin/oauth-credentials),
# NOT from an app registered on developer.atlassian.com - that path authenticates
# fine but gets 403 "Provider not installed" (see CLAUDE.md for the full story).
name: Report to Jira

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find issue key
        id: find
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          CANDIDATE="$BRANCH $MESSAGE"
          KEY=$(echo "$CANDIDATE" | grep -oE '(FALCON41|OTTER41)-[0-9]+' | head -n1 || true)
          if [ -z "$KEY" ]; then
            echo "No issue key found in branch '$BRANCH' or commit message - nothing to report (not every push has to be tied to an issue)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "key=$KEY" >> "$GITHUB_OUTPUT"
          fi
      - name: Get OAuth access token
        if: steps.find.outputs.found == 'true'
        id: token
        env:
          CLIENT_ID: ${{ secrets.JIRA_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -sf -X POST "https://api.atlassian.com/oauth/token" \
            -H "Content-Type: application/json" \
            -d "{\"audience\":\"api.atlassian.com\",\"grant_type\":\"client_credentials\",\"client_id\":\"$CLIENT_ID\",\"client_secret\":\"$CLIENT_SECRET\"}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Report build to Jira
        if: steps.find.outputs.found == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          ISSUE_KEY: ${{ steps.find.outputs.key }}
        run: |
          LAST_UPDATED=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          BODY=$(cat <<JSON
          {
            "builds": [
              {
                "pipelineId": "${{ github.repository }}",
                "buildNumber": ${{ github.event.workflow_run.run_number }},
                "updateSequenceNumber": ${{ github.event.workflow_run.id }},
                "displayName": "CI #${{ github.event.workflow_run.run_number }}",
                "url": "${{ github.event.workflow_run.html_url }}",
                "state": "successful",
                "lastUpdated": "$LAST_UPDATED",
                "issueKeys": ["$ISSUE_KEY"]
              }
            ]
          }
          JSON
          )
          curl -sf -X POST "https://api.atlassian.com/jira/builds/0.1/cloud/bbe05fb8-ed91-43cc-84bc-60e8cb811c80/bulk" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY"
